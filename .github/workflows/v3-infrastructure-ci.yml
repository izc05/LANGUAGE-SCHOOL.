name: V3 Infrastructure CI

on:
  pull_request:
    paths:
      - 'v3/infrastructure/**'
      - '.github/workflows/v3-infrastructure-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'v3/infrastructure/**'
      - '.github/workflows/v3-infrastructure-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          mapfile -d '' scripts < <(find v3/infrastructure -type f -name '*.sh' -print0)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo 'No infrastructure shell scripts found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Validate PocketBase loopback and hooks start wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/pb_hooks"
          OUTPUT=$(PB_URL=http://127.0.0.1:8091 \
            PB_BIN=/usr/bin/echo \
            PB_DATA=/tmp/pb_data \
            PB_MIGRATIONS=/tmp/pb_migrations \
            PB_HOOKS="$RUNNER_TEMP/pb_hooks" \
            bash v3/infrastructure/raspberry-pi/start-pocketbase.sh)
          printf '%s' "$OUTPUT" | grep -q -- '--http=127.0.0.1:8091'
          printf '%s' "$OUTPUT" | grep -q -- "--hooksDir=$RUNNER_TEMP/pb_hooks"

          if PB_URL=http://0.0.0.0:8091 \
            PB_BIN=/usr/bin/echo \
            PB_HOOKS="$RUNNER_TEMP/pb_hooks" \
            bash v3/infrastructure/raspberry-pi/start-pocketbase.sh; then
            echo 'PocketBase start wrapper accepted a non-loopback origin.' >&2
            exit 1
          fi

          if PB_URL=http://127.0.0.1:8091 \
            PB_BIN=/usr/bin/echo \
            PB_HOOKS="$RUNNER_TEMP/missing-hooks" \
            bash v3/infrastructure/raspberry-pi/start-pocketbase.sh; then
            echo 'PocketBase start wrapper accepted a missing hooks directory.' >&2
            exit 1
          fi

      - name: Validate PocketBase installer ships migrations and hooks
        run: |
          INSTALLER='v3/infrastructure/raspberry-pi/install-pocketbase.sh'
          grep -Fq 'HOOKS_SOURCE="$V3_DIR/pocketbase/pb_hooks"' "$INSTALLER"
          grep -Fq 'cp -a "$HOOKS_SOURCE"/. "$PB_DIR/pb_hooks/"' "$INSTALLER"
          grep -Fq 'cp -a "$MIGRATIONS_SOURCE"/. "$PB_DIR/pb_migrations/"' "$INSTALLER"
          grep -Fq 'find "$PB_DIR/pb_migrations" "$PB_DIR/pb_hooks" -type f -exec chmod 0644 {} +' "$INSTALLER"
          test -d v3/pocketbase/pb_hooks
          test -d v3/pocketbase/pb_migrations

      - name: Reject unsafe frontend production origins
        run: |
          DEPLOY='v3/infrastructure/raspberry-pi/deploy-frontend.sh'
          for ORIGIN in \
            'http://academy.example.org' \
            'https://english.example.com' \
            'https://localhost' \
            'https://127.0.0.1'; do
            set +e
            PUBLIC_ORIGIN="$ORIGIN" \
              PRODUCTION_ENV="$RUNNER_TEMP/not-present.env" \
              bash "$DEPLOY" >"$RUNNER_TEMP/deploy-origin.log" 2>&1
            EXIT_CODE=$?
            set -e
            if [ "$EXIT_CODE" -eq 0 ]; then
              cat "$RUNNER_TEMP/deploy-origin.log" >&2
              echo "Unsafe PUBLIC_ORIGIN was accepted: $ORIGIN" >&2
              exit 1
            fi
          done

      - name: Validate crawler policy source
        run: |
          ROBOTS='v3/frontend/public/robots.txt'
          test -f "$ROBOTS"
          grep -Fq 'User-agent: *' "$ROBOTS"
          grep -Fq 'Disallow: /admin' "$ROBOTS"
          grep -Fq 'Disallow: /alumno' "$ROBOTS"
          grep -Fq 'Disallow: /profesor' "$ROBOTS"
          grep -Fq 'Disallow: /api/' "$ROBOTS"
          grep -Fq 'User-agent: OAI-SearchBot' "$ROBOTS"
          grep -Fq 'User-agent: GPTBot' "$ROBOTS"
          grep -Fq 'v3/frontend/public/robots.txt' v3/infrastructure/cloudflare/SECURITY-RULES.md

      - name: Reject secret-like environment keys
        run: |
          ENV_FILE='v3/infrastructure/.env.example'
          test -f "$ENV_FILE"
          if grep -E '^[[:space:]]*[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|CREDENTIAL)[A-Z0-9_]*=' "$ENV_FILE"; then
            echo 'Secret-like variable keys are not allowed in the tracked production env example.' >&2
            exit 1
          fi

      - name: Verify pinned PocketBase Linux artifact checksums
        run: |
          source v3/infrastructure/.env.example
          for ARCH in amd64 arm64; do
            if [ "$ARCH" = 'amd64' ]; then
              EXPECTED="$PB_SHA256_AMD64"
            else
              EXPECTED="$PB_SHA256_ARM64"
            fi
            ARCHIVE="pocketbase_${PB_VERSION}_linux_${ARCH}.zip"
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/$ARCHIVE" \
              "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/$ARCHIVE"
            echo "$EXPECTED  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          done

      - name: Validate Nginx configuration, Cloudflare context and abuse guards
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          nginx -V 2>&1 | grep -q -- '--with-http_realip_module'

          sudo install -d -m 0755 /opt/language-school/frontend/assets
          printf '<!doctype html><title>Language School CI</title>\n' | sudo tee /opt/language-school/frontend/index.html >/dev/null
          printf 'console.log("asset");\n' | sudo tee /opt/language-school/frontend/assets/test.js >/dev/null
          sudo cp v3/frontend/public/robots.txt /opt/language-school/frontend/robots.txt

          cat >"$RUNNER_TEMP/header-upstream.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def respond(self):
                  body = (
                      f"x-real-ip={self.headers.get('X-Real-IP', '')}\n"
                      f"x-forwarded-for={self.headers.get('X-Forwarded-For', '')}\n"
                      f"x-forwarded-proto={self.headers.get('X-Forwarded-Proto', '')}\n"
                      f"x-forwarded-host={self.headers.get('X-Forwarded-Host', '')}\n"
                  ).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  self.respond()

              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0') or '0')
                  if length:
                      self.rfile.read(length)
                  self.respond()

              def log_message(self, *_args):
                  pass

          HTTPServer(('127.0.0.1', 8091), Handler).serve_forever()
          PY

          python3 "$RUNNER_TEMP/header-upstream.py" &
          UPSTREAM_PID=$!
          trap 'kill "$UPSTREAM_PID" 2>/dev/null || true' EXIT

          sed \
            -e 's|__PROXY_LISTEN__|127.0.0.1:8083|g' \
            -e 's|__PB_URL__|http://127.0.0.1:8091|g' \
            v3/infrastructure/reverse-proxy/language-school.nginx.conf \
            | sudo tee /etc/nginx/conf.d/language-school.conf >/dev/null

          sudo nginx -t
          sudo systemctl restart nginx

          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8083/ >/dev/null && break
            sleep 0.2
          done

          ROOT_HEADERS=$(curl -fsSI http://127.0.0.1:8083/)
          printf '%s\n' "$ROOT_HEADERS" | grep -Eqi '^X-Content-Type-Options:[[:space:]]*nosniff'
          printf '%s\n' "$ROOT_HEADERS" | grep -Eqi '^X-Frame-Options:[[:space:]]*SAMEORIGIN'
          printf '%s\n' "$ROOT_HEADERS" | grep -Eqi '^Permissions-Policy:'
          printf '%s\n' "$ROOT_HEADERS" | grep -Eqi '^Cache-Control:[[:space:]]*no-cache'
          if printf '%s\n' "$ROOT_HEADERS" | grep -Eqi '^X-Robots-Tag:'; then
            echo 'Public root must remain indexable.' >&2
            exit 1
          fi

          PRIVATE_HEADERS=$(curl -fsSI http://127.0.0.1:8083/acceso)
          printf '%s\n' "$PRIVATE_HEADERS" | grep -Eqi '^X-Robots-Tag:[[:space:]]*noindex, nofollow, noarchive'

          API_HEADERS=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8083/api/headers)
          printf '%s\n' "$API_HEADERS" | grep -Eqi '^X-Robots-Tag:[[:space:]]*noindex, nofollow, noarchive'

          ROBOTS_BODY=$(curl -fsS http://127.0.0.1:8083/robots.txt)
          printf '%s\n' "$ROBOTS_BODY" | grep -Fq 'User-agent: OAI-SearchBot'
          printf '%s\n' "$ROBOTS_BODY" | grep -Fq 'User-agent: GPTBot'

          ASSET_HEADERS=$(curl -fsSI http://127.0.0.1:8083/assets/test.js)
          printf '%s\n' "$ASSET_HEADERS" | grep -Eqi '^X-Content-Type-Options:[[:space:]]*nosniff'
          printf '%s\n' "$ASSET_HEADERS" | grep -Eqi '^Cache-Control:[[:space:]]*max-age='

          ADMIN_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/_/)
          test "$ADMIN_STATUS" = '404'

          PROXY_CONTEXT=$(curl -fsS \
            -H 'CF-Connecting-IP: 203.0.113.42' \
            -H 'X-Forwarded-Proto: https' \
            -H 'Host: school.example.org' \
            http://127.0.0.1:8083/api/headers)
          printf '%s\n' "$PROXY_CONTEXT" | grep -Fxq 'x-real-ip=203.0.113.42'
          printf '%s\n' "$PROXY_CONTEXT" | grep -Fxq 'x-forwarded-for=203.0.113.42'
          printf '%s\n' "$PROXY_CONTEXT" | grep -Fxq 'x-forwarded-proto=https'
          printf '%s\n' "$PROXY_CONTEXT" | grep -Fxq 'x-forwarded-host=school.example.org'

          LOCAL_CONTEXT=$(curl -fsS http://127.0.0.1:8083/api/headers)
          printf '%s\n' "$LOCAL_CONTEXT" | grep -Fxq 'x-real-ip=127.0.0.1'
          printf '%s\n' "$LOCAL_CONTEXT" | grep -Fxq 'x-forwarded-for=127.0.0.1'
          printf '%s\n' "$LOCAL_CONTEXT" | grep -Fxq 'x-forwarded-proto=http'

          RATE_LIMITED=0
          for attempt in {1..30}; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H 'CF-Connecting-IP: 198.51.100.77' \
              -H 'Content-Type: application/json' \
              --data '{"identity":"x","password":"x"}' \
              http://127.0.0.1:8083/api/collections/users/auth-with-password)
            if [ "$STATUS" = '429' ]; then
              RATE_LIMITED=1
              break
            fi
            test "$STATUS" = '200'
          done
          test "$RATE_LIMITED" = '1' || {
            echo 'Origin login limiter never returned HTTP 429.' >&2
            exit 1
          }

          # A GET to contact records is not counted by the POST-only write key.
          for attempt in {1..15}; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/api/collections/contact_requests/records)" = '200'
          done

      - name: Validate Cloudflare ingress catch-all
        run: |
          CONFIG='v3/infrastructure/cloudflare/config.yml.example'
          test -f "$CONFIG"
          grep -q '^ingress:' "$CONFIG"
          LAST_SERVICE=$(grep -E '^[[:space:]]+- service:' "$CONFIG" | tail -n 1 | sed 's/^[[:space:]]*//')
          test "$LAST_SERVICE" = '- service: http_status:404' || {
            echo 'Cloudflare ingress must end with a 404 catch-all.' >&2
            exit 1
          }

      - name: Validate backup timer calendar
        run: |
          grep -q '^OnCalendar=\*-\*-\* 03:30:00$' v3/infrastructure/backups/language-school-backup.timer
          systemd-analyze calendar '*-*-* 03:30:00'
