name: V3 Frontend CI

on:
  pull_request:
    paths:
      - 'v3/frontend/**'
      - '.github/workflows/v3-frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'v3/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build V3 frontend
        run: npm run build

      - name: Upload compiled visual preview
        uses: actions/upload-artifact@v4
        with:
          name: v3-frontend-preview-${{ github.sha }}
          path: v3/frontend/dist
          if-no-files-found: error
          retention-days: 7
