name: V3 Frontend CI

on:
  pull_request:
    paths:
      - 'v3/frontend/**'
      - '.github/workflows/v3-frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'v3/frontend/**'
      - '.github/workflows/v3-frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v3/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build V3 frontend in connected mode
        env:
          VITE_APP_MODE: connected
          VITE_POCKETBASE_URL: http://127.0.0.1:8090
        run: npm run build
