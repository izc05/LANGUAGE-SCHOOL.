# Preserve the visitor protocol supplied by Cloudflare, but fall back to the
# actual local scheme for direct loopback health checks or malformed values.
map $http_x_forwarded_proto $language_school_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Only write requests consume the origin-side abuse budgets below. Read-only
# Admin lists, audio, assets and realtime are deliberately excluded.
map $request_method $language_school_write_key {
    default "";
    POST $binary_remote_addr;
}

# Keep application/private routes out of search indexes even if their URLs are
# discovered outside robots.txt. Use $request_uri (not $uri) so the original
# route survives the SPA internal fallback to /index.html.
map $request_uri $language_school_robots_tag {
    default "";
    ~^/api(?:/|\?|$) "noindex, nofollow, noarchive";
    ~^/(?:acceso|activar-cuenta|recuperar-cuenta|admin|alumno|profesor)(?:/|\?|$) "noindex, nofollow, noarchive";
}

# Camera and microphone stay blocked site-wide. The dedicated student classroom
# is the only document allowed to request them. Entering the classroom performs
# a full document navigation so this policy is applied by the browser before
# Zoom Meeting SDK starts.
map $request_uri $language_school_permissions_policy {
    default "camera=(), microphone=(), geolocation=()";
    ~^/alumno/aula(?:/|\?|$) "camera=(self \"https://meet.jit.si\"), microphone=(self \"https://meet.jit.si\"), fullscreen=(self \"https://meet.jit.si\"), display-capture=(self \"https://meet.jit.si\"), geolocation=()";
}

# Defense in depth behind Cloudflare. These are intentionally generous enough
# for shared school/home IPs; Cloudflare remains the primary abuse-control edge.
limit_req_zone $language_school_write_key zone=ls_login:10m rate=30r/m;
limit_req_zone $language_school_write_key zone=ls_recovery:10m rate=10r/m;
limit_req_zone $language_school_write_key zone=ls_contact:10m rate=10r/m;
limit_req_zone $language_school_write_key zone=ls_placement_start:10m rate=30r/m;
limit_req_zone $language_school_write_key zone=ls_placement_write:10m rate=300r/m;

server {
    listen __PROXY_LISTEN__;
    server_name _;
    server_tokens off;

    root /opt/language-school/frontend;
    index index.html;

    # Blog gallery uploads are capped by the UI at 70 MiB per request and by
    # PocketBase at 50 MiB per file. Keep a small multipart overhead margin.
    client_max_body_size 80m;
    limit_req_status 429;

    # Nginx is bound to 127.0.0.1 and reached by cloudflared on the same host.
    # Only that loopback hop is trusted to replace the client address with the
    # CF-Connecting-IP value supplied by Cloudflare.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $language_school_permissions_policy always;
    add_header X-Robots-Tag $language_school_robots_tag always;
    add_header Content-Signal "search=yes, ai-input=yes, ai-train=no" always;

    # Shared upstream context. After ngx_http_realip_module runs, $remote_addr
    # is the Cloudflare visitor address when CF-Connecting-IP is present, or
    # 127.0.0.1 for a direct local health check.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $language_school_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;

    # Login attempts: fixed PocketBase auth endpoint.
    location = /api/collections/users/auth-with-password {
        limit_req zone=ls_login burst=10 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Password recovery is deliberately tighter than the general API surface.
    # PocketBase keeps request responses neutral; this budget also limits mail
    # amplification and repeated token-confirmation attempts at the origin.
    location = /api/collections/users/request-password-reset {
        limit_req zone=ls_recovery burst=3 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /api/collections/users/confirm-password-reset {
        limit_req zone=ls_recovery burst=5 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Protected contact endpoint. Turnstile is enforced by PocketBase and this
    # rate limit provides a second, origin-side abuse barrier.
    location = /api/language-school/contact {
        limit_req zone=ls_contact burst=3 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # The direct collection write is blocked by PocketBase. Keeping a small
    # POST budget here also protects the rejection path from request floods;
    # Admin GET requests do not consume this zone because their key is empty.
    location = /api/collections/contact_requests/records {
        limit_req zone=ls_contact burst=3 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /api/language-school/placement/start {
        limit_req zone=ls_placement_start burst=10 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Public placement mutations only. Question reads, result reads and audio
    # do not match this expression and remain outside this origin throttle.
    location ~ ^/api/language-school/placement/attempts/[^/]+/(answer|finish|contact)$ {
        limit_req zone=ls_placement_write burst=60 nodelay;
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # PocketBase realtime is SSE and legitimately needs a long-lived request.
    location = /api/realtime {
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Normal API calls should not inherit the one-hour realtime timeout.
    location /api/ {
        proxy_pass __PB_URL__;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ^~ /_/ {
        return 404;
    }

    location = /_ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # `expires -1` generates no-cache without redefining add_header, so the
        # security headers declared at server level remain inherited.
        expires -1;
    }
}
