map $http_cf_connecting_ip $language_school_client_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $language_school_client_ip zone=language_school_login:10m rate=5r/m;
limit_req_zone $language_school_client_ip zone=language_school_contact:10m rate=10r/m;

server {
    listen __PROXY_LISTEN__;
    server_name _;

    root /opt/language-school/frontend;
    index index.html;

    client_max_body_size 25m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The proxy only listens on loopback behind cloudflared. When present,
    # CF-Connecting-IP is therefore the real Cloudflare-provided visitor key;
    # direct local health checks safely fall back to the loopback address.
    location = /api/collections/users/auth-with-password {
        limit_req zone=language_school_login burst=3 nodelay;

        proxy_pass __PB_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $language_school_client_ip;
        proxy_set_header X-Forwarded-For $language_school_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location = /api/language-school/contact {
        limit_req zone=language_school_contact burst=5 nodelay;

        proxy_pass __PB_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $language_school_client_ip;
        proxy_set_header X-Forwarded-For $language_school_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass __PB_URL__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $language_school_client_ip;
        proxy_set_header X-Forwarded-For $language_school_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # PocketBase realtime uses a long-lived event stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /_/ {
        return 404;
    }

    location = /_ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
